<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#3558f5"><title>혜택콕 · 청년 혜택 알리미</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#161a26;--sub:#586075;--line:#e1e5ee;--pri:#3558f5;--priT:#fff;--ok:#0b7f58;--okBg:#dff4ea;--mid:#9a5b00;--midBg:#fff0d2;--red:#c4311f;--redBg:#fde4e0;--gray:#5b6272;--grayBg:#eceef4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11131a;--card:#1a1d27;--text:#eceef5;--sub:#a3aabc;--line:#2b3041;--pri:#7d93ff;--priT:#0d1020;--ok:#5fd6a5;--okBg:#12332a;--mid:#f0b95a;--midBg:#3a2c10;--red:#ff9a8a;--redBg:#3d1a16;--gray:#a3aabc;--grayBg:#262a38}}
:root[data-theme="dark"]{--bg:#11131a;--card:#1a1d27;--text:#eceef5;--sub:#a3aabc;--line:#2b3041;--pri:#7d93ff;--priT:#0d1020;--ok:#5fd6a5;--okBg:#12332a;--mid:#f0b95a;--midBg:#3a2c10;--red:#ff9a8a;--redBg:#3d1a16;--gray:#a3aabc;--grayBg:#262a38}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 56px}
.brand{font-weight:800;color:var(--pri);font-size:15px;letter-spacing:-.01em}
h1{font-size:27px;margin:4px 0 6px;letter-spacing:-.03em;line-height:1.25}
.lead{color:var(--sub);margin:0 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:4px}
select,input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
button{font-family:inherit;cursor:pointer}
.go{margin-top:16px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--priT);font-size:16px;font-weight:700}
.soon{margin-top:20px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:14px 16px}
.soon h2{font-size:15px;margin:0 0 8px}
.soon li{font-size:14px;margin:4px 0}
.soon ul{margin:0;padding-left:18px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}
.bar h2{font-size:18px;margin:0}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--sub);padding:6px 12px;border-radius:999px;font-size:13px}
.tab.on{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.item h3{margin:0 0 6px;font-size:17px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin:0 6px 4px 0}
.hi{background:var(--okBg);color:var(--ok)}.md{background:var(--midBg);color:var(--mid)}.rd{background:var(--redBg);color:var(--red)}.gy{background:var(--grayBg);color:var(--gray)}
.cat{font-size:12px;color:var(--sub)}
.item p{margin:8px 0;color:var(--sub);font-size:14px}
.meta{font-size:13px;margin:4px 0}.meta b{color:var(--text)}
.dl{margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13.5px}
.dl div{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:3px 0}
.dd{font-weight:800;color:var(--red)}
.cal{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--pri);color:var(--pri);text-decoration:none;font-weight:600}
.vf{font-size:12px;color:var(--sub);margin-top:6px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.link{padding:8px 14px;border-radius:10px;background:var(--pri);color:var(--priT);text-decoration:none;font-size:14px;font-weight:600}
.star{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px}
.star.on{border-color:var(--pri);color:var(--pri);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.note{font-size:12.5px;color:var(--sub);margin-top:24px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">혜택콕</div>
  <h1>받을 수 있는 청년 혜택,<br>마감 전에 콕 짚어드려요</h1>
  <p class="lead">내 조건을 넣으면 맞는 지원금을 골라서 마감일과 함께 보여줘요.</p>

  <div class="panel">
    <div class="grid">
      <div><label for="age">만 나이</label><input id="age" type="number" min="15" max="45" value="22"></div>
      <div><label for="region">시·도</label>
        <select id="region"><option>서울</option><option>경기</option><option>인천</option><option>부산</option><option>대구</option><option>대전</option><option>광주</option><option>울산</option><option>세종</option><option>강원</option><option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option></select></div>
      <div><label for="sub">시·군·구</label><select id="sub"></select></div>
      <div><label for="status">현재 상태</label>
        <select id="status"><option value="student">대학(원) 재학·휴학</option><option value="seek">졸업 후 구직 중</option><option value="work">재직 중</option><option value="other">기타 (미취업·단기근로)</option></select></div>
      <div><label for="house">거주 형태</label>
        <select id="house"><option value="rent">월세 (부모와 따로 거주)</option><option value="jeonse">전세</option><option value="family">부모님 집</option><option value="dorm">기숙사·고시원 등</option></select></div>
      <div><label for="income">소득·가구 형편 (대략)</label>
        <select id="income"><option value="low">낮은 편 (기초·차상위·저소득)</option><option value="mid">보통</option><option value="high">높은 편</option></select></div>
      <div><label for="home">본인 명의 주택</label>
        <select id="home"><option value="none">없음</option><option value="has">있음</option></select></div>
    </div>
    <button class="go" id="go">내 혜택 찾기</button>
  </div>

  <div id="soon"></div>

  <div class="bar">
    <h2 id="title">추천 결과</h2>
    <div class="tabs"><button class="tab on" data-t="all">전체</button><button class="tab" data-t="fav">관심 <span id="fc">0</span></button></div>
  </div>
  <div id="list"></div>

  <div class="note">기준일 2026년 11월 25일. 공식 공고와 보도자료로 확인한 항목에는 &lsquo;확인됨&rsquo;, 일반 안내만 담은 항목에는 &lsquo;공식 확인 필요&rsquo;를 표시했어요. 지원 대상과 일정은 수시로 바뀌니 신청 전에 공식 사이트에서 꼭 다시 확인하세요. 마감일은 &lsquo;캘린더 추가&rsquo; 버튼으로 구글 캘린더에 등록해서 알림을 받을 수 있어요.</div>
</div>

const $=id=>document.getElementById(id);
function fillSub(){const r=$("region").value;$("sub").innerHTML='<option value="">전체 (선택 안 함)</option>'+SUB[r].split(",").map(x=>'<option>'+x+'</option>').join("")}
$("region").onchange=fillSub;fillSub();
const T0=new Date();T0.setHours(0,0,0,0);
let fav=[],tab="all",last=null;
try{fav=JSON.parse(localStorage.getItem("yb_fav")||"[]")}catch(e){}
function save(){try{localStorage.setItem("yb_fav",JSON.stringify(fav))}catch(e){}}
function state(){return{age:+$("age").value||0,region:$("region").value,status:$("status").value,house:$("house").value,income:$("income").value,home:$("home").value,sub:$("sub").value}}
function dd(d){return Math.round((new Date(d+"T00:00:00")-T0)/864e5)}
function fmt(d){const a=d.split("-");return a[0]+"."+(+a[1])+"."+(+a[2])}
function gcal(p,x){const s=x.d.replace(/-/g,"");const e=new Date(x.d+"T00:00:00");e.setDate(e.getDate()+1);
 const es=e.getFullYear()+String(e.getMonth()+1).padStart(2,"0")+String(e.getDate()).padStart(2,"0");
 return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("[혜택콕] "+p.n+" "+x.t)+"&dates="+s+"/"+es+"&details="+encodeURIComponent(p.how+" · "+p.u)+"&sf=true"}
function dday(n){return n===0?"D-day":"D-"+n}
function render(){
  $("fc").textContent=fav.length;
  const L=$("list");
  if(!last){L.innerHTML='<div class="empty">조건을 입력하고 &lsquo;내 혜택 찾기&rsquo;를 눌러보세요.</div>';$("soon").innerHTML="";return}
  let all=P.map(p=>({p,m:p.f(last)})).filter(x=>x.m);
  const rank=x=>{const o=x.p.st[1]==="gy"?2:0;return (x.m==="hi"?0:1)+o};
  all.sort((a,b)=>rank(a)-rank(b));
  const up=[];
  all.forEach(({p})=>(p.dl||[]).forEach(x=>{const n=dd(x.d);if(n>=0)up.push({p,x,n})}));
  up.sort((a,b)=>a.n-b.n);
  $("soon").innerHTML=up.length?'<div class="soon"><h2>⏰ 다가오는 마감</h2><ul>'+up.map(u=>'<li><b>'+dday(u.n)+'</b> · '+u.p.n+' '+u.x.t+' ('+fmt(u.x.d)+')</li>').join("")+'</ul></div>':"";
  let rs=all;
  $("title").textContent=tab==="fav"?"관심 목록":"추천 결과 "+all.length+"건";
  if(tab==="fav")rs=all.filter(x=>fav.includes(x.p.id));
  if(!rs.length){L.innerHTML='<div class="empty">'+(tab==="fav"?"관심 표시한 혜택이 없어요.":"조건에 맞는 혜택을 찾지 못했어요. 입력을 바꿔보세요.")+'</div>';return}
  L.innerHTML=rs.map(({p,m})=>{
    const on=fav.includes(p.id);
    const stc={ok:"hi",gy:"gy",md:"md"}[p.st[1]];
    const dls=(p.dl||[]).map(x=>{const n=dd(x.d);
      return '<div><span>'+x.t+' · '+fmt(x.d)+(n>=0?' <span class="dd">'+dday(n)+'</span>':' (종료)')+'</span>'+(n>=0?'<a class="cal" href="'+gcal(p,x)+'" target="_blank" rel="noopener">캘린더 추가</a>':'')+'</div>'}).join("");
    return '<div class="item"><h3>'+p.n+(p.id==="local"?" · "+last.region+(last.sub?" "+last.sub:""):"")+'</h3>'
    +'<span class="tag '+m+'">'+(m==="hi"?"받을 가능성 높음":"조건 확인 필요")+'</span><span class="tag '+stc+'">'+p.st[0]+'</span><span class="cat">'+p.c+'</span>'
    +'<p>'+p.d+'</p><div class="meta"><b>대상</b> '+p.who+'</div><div class="meta"><b>신청</b> '+p.how+'</div>'
    +(dls?'<div class="dl">'+dls+'</div>':'')
    +'<div class="vf">'+(p.v?"✔ 확인됨 (2026.11.25 기준)":"ℹ 일반 안내 · 공식 확인 필요")+'</div>'
    +'<div class="row"><a class="link" href="'+p.u+'" target="_blank" rel="noopener">공식 사이트</a><button class="star'+(on?" on":"")+'" data-id="'+p.id+'">'+(on?"★ 관심 해제":"☆ 관심 추가")+'</button></div></div>'
  }).join("");
}
$("go").onclick=()=>{last=state();tab="all";document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t==="all"));render();$("soon").scrollIntoView({behavior:"smooth"})};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));render()});
$("list").onclick=e=>{const b=e.target.closest(".star");if(!b)return;const id=b.dataset.id;fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];save();render()};
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
